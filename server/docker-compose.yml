services:
  eureka_api:
    build: .
    container_name: eureka_api
    restart: always
    network_mode: "host"
    env_file: .env   # PORT y DATABASE_URL (ver .env.example)
    volumes:
      - ./server.js:/app/server.js
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
